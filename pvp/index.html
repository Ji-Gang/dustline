<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>DUSTLINE · 多人联机</title><link rel="stylesheet" href="pvp.css"></head><body>
<canvas id="game"></canvas><div id="shade"></div>
<header id="brand"><b>DUSTLINE<span>ONLINE</span></b><small id="versionLabel">0.15</small></header>
<main id="connect" class="panel"><h1>进入战场</h1><nav id="entryTabs"><button id="createTab" class="active">创建房间</button><button id="joinTab">加入房间</button></nav><div class="identity"><label>代号<input id="name" maxlength="16" value="玩家"></label><label>连接<select id="transport"><option value="relay">互联网</option><option value="lan">局域网</option></select></label></div>
<section id="hostPane"><div class="settings-grid"><label>地图<select id="createMap"><option value="foundry">铸造工坊</option><option value="quarry">砂岩采石场</option></select></label><label>模式<select id="createMode"><option value="team">团队死斗</option><option value="arsenal">个人升级战</option></select></label><label>人数<input id="maxPlayers" type="number" min="2" max="16" value="4"></label><label>目标击杀<input id="target" type="number" min="1" max="200" value="30"></label></div><details><summary>高级设置</summary><label>重生保护<input id="protection" type="number" min="1" max="10" value="4"></label><label>重生等待<input id="respawn" type="number" min="1" max="10" value="3"></label><label id="portRow" class="hidden">端口<input id="port" type="number" min="1024" max="65535" value="27888"></label></details><button id="host" class="primary-action">创建房间 <span>↗</span></button></section>
<section id="joinPane" class="hidden"><label id="addressRow" class="hidden">房主地址<input id="address" placeholder="IP:端口" maxlength="260"></label><label id="pinRow" class="hidden">房间码<input id="pin" maxlength="6"></label><label id="relayCodeRow">房间码<textarea id="relayCode" rows="3" maxlength="100" placeholder="粘贴房间码"></textarea></label><button id="join" class="primary-action">加入房间 <span>↗</span></button></section><p id="error" role="alert"></p></main>
<section id="lobby" class="panel hidden"><h1 id="lobbyTitle">队伍准备</h1><details id="connectionDetails"><summary>连接信息</summary><p id="roomInfo"></p><p id="connectionStatus"></p></details><button id="copyRoom" class="secondary hidden">复制房间码</button><div class="columns"><section><h2 id="blueTitle" class="blue">蓝队</h2><div id="blueList"></div></section><section><h2 id="redTitle" class="red">红队</h2><div id="redList"></div></section></div><p id="settingsText" class="room-summary"></p><div id="hostSettings"><label>地图<select id="roomMap"><option value="foundry">铸造工坊 · 80×60</option><option value="quarry">砂岩采石场 · 80×60</option></select></label><label>模式<select id="roomMode"><option value="team">团队死斗</option><option value="arsenal">个人武器升级战</option></select></label><label>人数上限<input id="roomPlayers" type="number" min="2" max="16" value="4"></label><label>目标击杀<input id="roomTarget" type="number" min="1" max="200" value="30"></label><label>保护秒数<input id="roomProtection" type="number" min="1" max="10" value="4"></label><label>重生秒数<input id="roomRespawn" type="number" min="1" max="10" value="3"></label><button id="settingsApply" class="hidden">应用</button></div><div id="botControls" class="hidden"><label>AI 难度<select id="botDifficulty"><option value="easy">简单</option><option value="normal" selected>普通</option><option value="hard">困难</option></select></label><button id="addBlueBot" class="secondary">蓝队 + AI</button><button id="addRedBot" class="secondary">红队 + AI</button></div><button id="start">立即开始</button><button id="leave" class="secondary">离开房间</button><p id="lobbyStatus" class="hidden"></p></section>
<div id="damageVignette" aria-hidden="true"></div><div id="hud" class="hidden"><div id="score"><b id="blueScore" class="blue">0</b><div><small id="modeLabel">团队死斗 · 自定人数</small><strong id="goal">先到 30 击杀</strong></div><b id="redScore" class="red">0</b></div><div id="network">已连接</div><canvas id="radar" width="180" height="135"></canvas><div id="feed"></div><div id="crosshair">＋</div><div id="scope" class="hidden"><div></div><i></i><b></b></div><div id="hitMarker" class="hidden"><i></i><i></i><i></i><i></i></div><div id="status"></div><div id="bottom"><strong id="hp">100 HP</strong><span id="spawnHint"></span><div><small id="equipment"></small><b id="weaponName"></b><strong id="ammo"></strong></div></div></div>
<section id="armory" class="panel hidden"><h2>选择装备</h2><h3>1 · 主武器</h3><div id="guns" class="weapon-grid"></div><h3>2 · 副武器</h3><div id="sidearms" class="weapon-grid"></div><p>3 · 战术匕首</p><button id="deploy">进入战场</button></section>
<section id="pause" class="panel hidden"><h2>操作已暂停</h2><button id="resume">继续游戏</button><button id="leaveMatch" class="secondary">离开房间</button></section>
<section id="result" class="panel hidden"><h1 id="winner"></h1><p id="finalScore"></p><div id="results"></div><button id="rematch">返回房间 / 再战</button></section>
<div id="killBadge" class="hidden" role="status"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4C12 4 7 12 7 22c0 7 4 11 9 13v8h16v-8c5-2 9-6 9-13C41 12 36 4 24 4Z" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="m13 21 8 3-3 6h-5Zm22 0-8 3 3 6h5ZM24 28l-3 6h6ZM20 36v7m8-7v7" fill="currentColor" stroke="currentColor" stroke-width="2"/></svg><div><strong id="killTitle">击杀确认</strong><span id="killVictim"></span></div></div><div id="toast"></div>
<script src="../vendor/three.min.js"></script><script src="../map.js"></script><script src="../core.js"></script><script src="loadout.js"></script><script src="../models.js"></script><script src="../weapons.js"></script><script src="arena.js"></script><script src="asset-pack.js"></script><script src="assets.js"></script><script src="art.js"></script><script src="netcode.js"></script><script src="prediction.js"></script><script src="direct.js"></script><script src="feedback.js"></script><script src="client.js"></script></body></html>
