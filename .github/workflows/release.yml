name: Build and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dustline-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - shell: pwsh
        run: ./desktop/release.ps1
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Version already released; tests passed, existing release unchanged.'; exit 0 }
          gh release create "v$version" dist/release/* --target $env:GITHUB_SHA --title "DUSTLINE $version" --notes 'Download DUSTLINE-Windows.zip for first installation. Existing players can run update.cmd.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
